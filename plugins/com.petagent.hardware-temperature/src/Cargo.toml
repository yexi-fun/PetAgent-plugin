[package]
name = "hardware-temperature"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
nvml-wrapper = "0.12.1"
wmi = { version = "0.18.4", default-features = false }
